<!-- Header estilo Tienda de Llantas -->
<header class="header-ml">
    <div class="header-container">
        <!-- Logo/Icono -->
        <div class="header-logo" routerLink="./dashboard">
            <img [src]="_IconApp" alt="Logo" class="logo-icon" width="200" height="100" />
        </div>

        <!-- Menú hamburguesa: solo visible en mobile, a la izquierda del buscador -->
        <button mat-icon-button class="nav-menu-button" (click)="toggleNavMenu()">
            <mat-icon>menu</mat-icon>
        </button>

        <!-- Buscador -->
        <div class="header-search">
            <mat-form-field appearance="outline" class="search-field">
                <input matInput placeholder="Buscar productos, marcas y más..." [(ngModel)]="searchQuery"
                    (keyup.enter)="onSearch()" />
                <button mat-icon-button matSuffix (click)="onSearch()" class="search-button">
                    <mat-icon>search</mat-icon>
                </button>
            </mat-form-field>
        </div>

        <!-- Sección de botones -->
        <div class="header-actions">
            <button mat-button class="action-button" routerLink="./my-purchases" *ngIf="userLogin">
                <mat-icon>shopping_bag</mat-icon>
                <span class="action-text">Mis compras</span>
            </button>

            <button mat-button class="action-button" (click)="toggleFavorites()">
                <mat-icon>favorite_border</mat-icon>
                <span class="action-text">Favoritos</span>
            </button>

            <!-- Botón de Usuario (Logueado) -->
            <button mat-button class="action-button" [matMenuTriggerFor]="userMenu" *ngIf="userLogin">
                <mat-icon>account_circle</mat-icon>
                <span class="action-text">{{ userLogin.name || 'Usuario' }}</span>
            </button>

            <!-- Botón de Iniciar Sesión (No Logueado) -->
            <button mat-button class="action-button" (click)="handleUserAction()" *ngIf="!userLogin">
                <mat-icon>login</mat-icon>
                <span class="action-text">Iniciar Sesión</span>
            </button>

            <button mat-icon-button class="cart-button" [class.animate-cart]="cartAnimated" (click)="toggleCart()"
                [matBadge]="cartCount" matBadgeColor="warn" *ngIf="cartCount > 0">
                <mat-icon>shopping_cart</mat-icon>
            </button>
            <button mat-icon-button class="cart-button" [class.animate-cart]="cartAnimated" (click)="toggleCart()"
                *ngIf="cartCount === 0">
                <mat-icon>shopping_cart</mat-icon>
            </button>
        </div>
    </div>

    <!-- Menú de usuario -->
    <mat-menu #userMenu="matMenu" class="user-dropdown">
        <button mat-menu-item disabled>
            <mat-icon>person</mat-icon>
            <span>{{ userLogin?.name || 'Usuario' }}</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="./perfil">
            <mat-icon>settings</mat-icon>
            <span>Mi perfil</span>
        </button>
        <button mat-menu-item routerLink="./my-purchases">
            <mat-icon>receipt_long</mat-icon>
            <span>Mis compras</span>
        </button>
        <button mat-menu-item (click)="toggleFavorites()">
            <mat-icon>favorite</mat-icon>
            <span>Mis favoritos</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
            <mat-icon color="warn">logout</mat-icon>
            <span>Cerrar sesión</span>
        </button>
    </mat-menu>
</header>

<!-- Contenedor exterior solo para el menu lateral (hamburguesa) - va aparte
     porque Angular Material no permite dos drawers con position="start"
     en el mismo mat-sidenav-container (el de favoritos ya usa "start"). -->
<mat-sidenav-container class="nav-menu-outer-container" [hasBackdrop]="true">
    <mat-sidenav #navSidenav mode="over" position="start" class="nav-menu-sidenav">
        <div class="nav-menu-header">
            <h3>Menú</h3>
            <button mat-icon-button (click)="toggleNavMenu()">
                <mat-icon>close</mat-icon>
            </button>
        </div>
        <mat-nav-list>
            <a mat-list-item routerLink="./my-purchases" (click)="toggleNavMenu()" *ngIf="userLogin">
                <mat-icon matListItemIcon>shopping_bag</mat-icon>
                <span matListItemTitle>Mis compras</span>
            </a>
            <a mat-list-item (click)="toggleFavorites(); toggleNavMenu()">
                <mat-icon matListItemIcon>favorite_border</mat-icon>
                <span matListItemTitle>Favoritos</span>
            </a>
            <ng-container *ngIf="userLogin; else navLoginLink">
                <a mat-list-item routerLink="./perfil" (click)="toggleNavMenu()">
                    <mat-icon matListItemIcon>settings</mat-icon>
                    <span matListItemTitle>Mi perfil</span>
                </a>
                <a mat-list-item (click)="logout(); toggleNavMenu()">
                    <mat-icon matListItemIcon color="warn">logout</mat-icon>
                    <span matListItemTitle>Cerrar sesión</span>
                </a>
            </ng-container>
            <ng-template #navLoginLink>
                <a mat-list-item (click)="handleUserAction(); toggleNavMenu()">
                    <mat-icon matListItemIcon>login</mat-icon>
                    <span matListItemTitle>Iniciar Sesión</span>
                </a>
            </ng-template>
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
        <mat-sidenav-container class="main-sidenav-container" [hasBackdrop]="showBackdrop">
            <mat-sidenav #favoritesSidenav mode="over" position="start" class="favorites-sidenav">
                <app-favorites-overlay (close)="toggleFavorites()"></app-favorites-overlay>
            </mat-sidenav>

            <mat-sidenav #cartSidenav mode="over" position="end" class="cart-sidenav">
                <app-cart-overlay (close)="toggleCart()"></app-cart-overlay>
            </mat-sidenav>

            <mat-sidenav-content>
                <div class="container" style="margin-bottom: 50px;">
                    <router-outlet />
                </div>
            </mat-sidenav-content>
        </mat-sidenav-container>
    </mat-sidenav-content>
</mat-sidenav-container>
