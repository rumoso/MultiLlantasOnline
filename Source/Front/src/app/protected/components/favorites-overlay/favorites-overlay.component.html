<div class="favorites-container">
    <div class="favorites-header">
        <div class="header-title">
            <mat-icon>favorite</mat-icon>
            <h2>Mis favoritos</h2>
            <span class="items-count" *ngIf="favorites.length > 0">{{ favorites.length }}</span>
        </div>
        <div class="header-actions">
            <button mat-icon-button (click)="viewAll()" matTooltip="Ver todos" *ngIf="favorites.length > 0">
                <mat-icon>open_in_new</mat-icon>
            </button>
            <button mat-icon-button (click)="closeSidebar()">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>

    <div class="favorites-content" *ngIf="favorites.length > 0; else emptyFavorites">
        <div class="favorites-list">
            <div class="favorite-item" *ngFor="let item of favorites">
                <div class="item-image">
                    <img [src]="item.imagen_url || 'assets/img/default-tire.png'" [alt]="item.nombre"
                        (error)="$any($event.target).src='assets/img/default-tire.png'">
                </div>

                <div class="item-info">
                    <div class="item-top">
                        <h3 class="item-name">{{ item.nombre }}</h3>
                        <button class="item-remove" (click)="removeFavorite(item)" aria-label="Quitar de favoritos">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>

                    <span class="item-medida" *ngIf="medida(item)">{{ medida(item) }}</span>

                    <div class="item-controls">
                        <span class="item-price">{{ item.precio | currency:'MXN' }}</span>
                        <button class="btn-add" (click)="addToCart(item)">
                            <mat-icon>add_shopping_cart</mat-icon>
                            <span>Agregar</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <ng-template #emptyFavorites>
        <div class="empty-favorites-message">
            <mat-icon class="empty-icon">favorite_border</mat-icon>
            <h3>No tienes favoritos aún</h3>
            <p>Guarda las llantas que más te gusten aquí.</p>
        </div>
    </ng-template>
</div>
