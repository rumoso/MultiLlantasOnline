<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <mat-icon class="login-icon">tire_repair</mat-icon>
            <h2>Crea tu cuenta</h2>
            <p>Regístrate para darle seguimiento a tus pedidos</p>
        </div>

        <form class="login-form">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nombre completo</mat-label>
                <input matInput id="tbxNombre" name="tbxNombre" placeholder="Tu nombre completo"
                    [(ngModel)]="myRegister.name" (keydown.enter)="focusNext('tbxUsuarioReg')">
                <mat-icon matSuffix>badge</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Usuario o número celular</mat-label>
                <input matInput id="tbxUsuarioReg" name="tbxUsuarioReg" placeholder="tu@correo.com o 10 dígitos"
                    [(ngModel)]="myRegister.userName" (keydown.enter)="focusNext('tbxPwdReg')">
                <mat-icon matSuffix>person</mat-icon>
            </mat-form-field>
            <p class="campo-error" *ngIf="myRegister.userName && !usuarioEsValido">
                Ingresa un correo válido o un número de celular a 10 dígitos
            </p>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Contraseña</mat-label>
                <input matInput id="tbxPwdReg" name="tbxPwdReg" [type]="hidePwd ? 'password' : 'text'"
                    placeholder="Mínimo 6 caracteres" [(ngModel)]="myRegister.pwd" (keydown.enter)="focusNext('tbxPwdReg2')">
                <button mat-icon-button matSuffix (click)="hidePwd = !hidePwd" [attr.aria-label]="'Ocultar contraseña'"
                    type="button">
                    <mat-icon>{{hidePwd ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Confirmar contraseña</mat-label>
                <input matInput id="tbxPwdReg2" name="tbxPwdReg2" [type]="hidePwd2 ? 'password' : 'text'"
                    placeholder="Repite la contraseña" [(ngModel)]="myRegister.pwd2" (keydown.enter)="fn_register()">
                <button mat-icon-button matSuffix (click)="hidePwd2 = !hidePwd2" [attr.aria-label]="'Ocultar contraseña'"
                    type="button">
                    <mat-icon>{{hidePwd2 ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            <p class="campo-error" *ngIf="myRegister.pwd2 && !passwordsCoinciden">
                Las contraseñas no coinciden
            </p>

            <button mat-raised-button color="primary" class="btn-login" (click)="fn_register()"
                [disabled]="bShowSpinner || !formValido">
                <span *ngIf="!bShowSpinner">CREAR CUENTA</span>
                <mat-spinner diameter="20" *ngIf="bShowSpinner" color="accent"></mat-spinner>
            </button>

            <button mat-button type="button" class="full-width" (click)="irALogin()">
                ¿Ya tienes cuenta? Inicia sesión
            </button>

            <button mat-stroked-button type="button" class="full-width btn-cancelar" (click)="cancelar()">
                No crear cuenta, regresar al catálogo
            </button>
        </form>
    </div>
</div>
