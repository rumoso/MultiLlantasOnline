<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <mat-icon class="login-icon">tire_repair</mat-icon>
            <h2>Crea tu cuenta</h2>
            <p>Regístrate para darle seguimiento a tus pedidos</p>
        </div>

        <form class="login-form">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nombre</mat-label>
                <input matInput id="tbxNombre" name="tbxNombre" placeholder="Tu nombre completo"
                    [(ngModel)]="myRegister.name" (keydown.enter)="focusNext('tbxUsuarioReg')">
                <mat-icon matSuffix>badge</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Usuario</mat-label>
                <input matInput id="tbxUsuarioReg" name="tbxUsuarioReg" placeholder="Elige un usuario"
                    [(ngModel)]="myRegister.userName" (keydown.enter)="focusNext('tbxEmailReg')">
                <mat-icon matSuffix>person</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Correo</mat-label>
                <input matInput id="tbxEmailReg" name="tbxEmailReg" type="email" placeholder="tu@correo.com"
                    [(ngModel)]="myRegister.email" (keydown.enter)="focusNext('tbxTelefonoReg')">
                <mat-icon matSuffix>mail</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Teléfono (opcional)</mat-label>
                <input matInput id="tbxTelefonoReg" name="tbxTelefonoReg" placeholder="10 dígitos"
                    [(ngModel)]="myRegister.telefono" (keydown.enter)="focusNext('tbxPwdReg')">
                <mat-icon matSuffix>phone</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Contraseña</mat-label>
                <input matInput id="tbxPwdReg" name="tbxPwdReg" [type]="hidePwd ? 'password' : 'text'"
                    placeholder="Mínimo 6 caracteres" [(ngModel)]="myRegister.pwd" (keydown.enter)="fn_register()">
                <button mat-icon-button matSuffix (click)="hidePwd = !hidePwd" [attr.aria-label]="'Ocultar contraseña'"
                    type="button">
                    <mat-icon>{{hidePwd ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>

            <button mat-raised-button color="primary" class="btn-login" (click)="fn_register()"
                [disabled]="bShowSpinner || !formValido">
                <span *ngIf="!bShowSpinner">CREAR CUENTA</span>
                <mat-spinner diameter="20" *ngIf="bShowSpinner" color="accent"></mat-spinner>
            </button>

            <button mat-button type="button" class="full-width" (click)="irALogin()">
                ¿Ya tienes cuenta? Inicia sesión
            </button>
        </form>
    </div>
</div>
